{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanzania Tourism</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/style01.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-nav fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                <i class="bi bi-globe-americas me-2"></i>Tanzania Tourism
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{% url 'home' %}"><i class="bi bi-house-door me-1"></i>Home</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.path == '/destinations/' %}active{% endif %}" href="{% url 'destinations' %}"><i class="bi bi-map me-1"></i>Destinations</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.path == '/hotels/' %}active{% endif %}" href="{% url 'hotels' %}"><i class="bi bi-building me-1"></i>Hotels</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.path == '/about/' %}active{% endif %}" href="{% url 'about' %}"><i class="bi bi-info-circle me-1"></i>About</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.path == '/contact/' %}active{% endif %}" href="{% url 'contact' %}"><i class="bi bi-envelope me-1"></i>Contact</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.path == '/register/' %}active{% endif %}" href="{% url 'register' %}"><i class="bi bi-envelope me-1"></i>register</a></li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- Spacer for fixed navbar -->
    <div class="nav-spacer"></div>

    <main class="container py-5 px-4">
        <div class="row">
            <div class="col-12">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </main>

    <footer class="text-center bg-dark text-white p-3">
        <p>&copy; 2025 Tanzania Tourism</p>
    </footer>
</body>
</html>
